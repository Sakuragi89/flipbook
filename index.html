<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .photo-count {
            color: #888;
            font-size: 14px;
        }
        
        /* Gallery Grid */
        .gallery-container {
            padding: 80px 10px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 3px;
        }
        
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 4px;
            }
        }
        
        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: #111;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .gallery-item:active {
            opacity: 0.7;
        }
        
        /* Selection Mode */
        .gallery-item.selected::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: #007AFF;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid white;
        }
        
        /* Fullscreen Viewer */
        .viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
        }
        
        .viewer.active {
            display: block;
        }
        
        .viewer-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
        }
        
        .viewer-close {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .viewer-info {
            color: white;
            font-size: 14px;
        }
        
        .viewer-actions {
            display: flex;
            gap: 15px;
        }
        
        .viewer-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .viewer-btn:active {
            transform: scale(0.9);
        }
        
        /* Image Container */
        .viewer-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        
        .viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: grab;
        }
        
        .viewer-image.zoomed {
            cursor: move;
        }
        
        /* Navigation Arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 32px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 1001;
        }
        
        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .nav-arrow.left {
            left: 20px;
        }
        
        .nav-arrow.right {
            right: 20px;
        }
        
        @media (max-width: 768px) {
            .nav-arrow {
                display: none;
            }
        }
        
        /* Bottom Toolbar */
        .viewer-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 1001;
        }
        
        .toolbar-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s;
        }
        
        .toolbar-btn span {
            font-size: 12px;
        }
        
        .toolbar-btn:active {
            transform: scale(0.9);
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 18px;
        }
        
        /* Selection Toolbar */
        .selection-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: none;
            justify-content: space-around;
            z-index: 99;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .selection-toolbar.active {
            display: flex;
        }
        
        .selection-toolbar-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .selection-toolbar-btn .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>📸 Gallery</h1>
            <div class="photo-count" id="photoCount">0 photos</div>
        </div>
    </div>
    
    <!-- Gallery Grid -->
    <div class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading">Loading photos...</div>
        </div>
    </div>
    
    <!-- Selection Toolbar -->
    <div class="selection-toolbar" id="selectionToolbar">
        <button class="selection-toolbar-btn" onclick="selectAll()">
            <span class="icon">☑️</span>
            <span>Select All</span>
        </button>
        <button class="selection-toolbar-btn" onclick="deselectAll()">
            <span class="icon">⬜</span>
            <span>Deselect</span>
        </button>
        <button class="selection-toolbar-btn" onclick="downloadSelected()">
            <span class="icon">⬇️</span>
            <span id="downloadCount">Download (0)</span>
        </button>
    </div>
    
    <!-- Fullscreen Viewer -->
    <div class="viewer" id="viewer">
        <div class="viewer-header">
            <button class="viewer-close" onclick="closeViewer()">×</button>
            <div class="viewer-info" id="viewerInfo">1 / 1</div>
            <div class="viewer-actions">
                <button class="viewer-btn" onclick="downloadCurrent()">⬇</button>
            </div>
        </div>
        
        <button class="nav-arrow left" onclick="prevImage()">‹</button>
        <button class="nav-arrow right" onclick="nextImage()">›</button>
        
        <div class="viewer-image-container" id="imageContainer">
            <img id="viewerImage" class="viewer-image" alt="Photo">
        </div>
        
        <div class="viewer-toolbar">
            <button class="toolbar-btn" onclick="zoomOut()">
                <div>🔍−</div>
                <span>Zoom Out</span>
            </button>
            <button class="toolbar-btn" onclick="resetZoom()">
                <div>⟲</div>
                <span>Reset</span>
            </button>
            <button class="toolbar-btn" onclick="zoomIn()">
                <div>🔍+</div>
                <span>Zoom In</span>
            </button>
        </div>
    </div>

    <script>
        let photos = [];
        let currentIndex = 0;
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;
        let selectedPhotos = new Set();
        let selectionMode = false;
        
        // Configuration
        const GITHUB_CONFIG = {
            owner: 'sakuragi89',
            repo: 'flipbook',
            branch: 'main',
            path: 'screenshots'
        };
        
        const GDRIVE_CONFIG = {
            enabled: false,
            folderLinks: []
        };
        
        // Load photos
        async function loadPhotos() {
            photos = [];
            
            // Load from Google Drive
            if (GDRIVE_CONFIG.enabled && GDRIVE_CONFIG.folderLinks.length > 0) {
                for (const link of GDRIVE_CONFIG.folderLinks) {
                    if (link.includes('/file/d/')) {
                        const fileId = link.split('/file/d/')[1].split('/')[0];
                        const directUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
                        photos.push(directUrl);
                    }
                }
            }
            
            // Load from GitHub
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`
                );
                
                if (response.ok) {
                    const files = await response.json();
                    const githubPhotos = files
                        .filter(file => file.name.match(/\.(jpg|jpeg|png|gif)$/i))
                        .map(file => file.download_url);
                    photos.push(...githubPhotos);
                }
            } catch (error) {
                console.error('Error loading from GitHub:', error);
            }
            
            if (photos.length === 0) {
                document.getElementById('galleryGrid').innerHTML = 
                    '<div class="loading">No photos found. Upload via admin panel!</div>';
                return;
            }
            
            displayGallery();
        }
        
        // Display gallery grid
        function displayGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            photos.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="${url}" alt="Photo ${index + 1}" loading="lazy">`;
                
                // Click or long-press handlers
                let longPressTimer;
                
                item.addEventListener('click', () => {
                    if (selectionMode) {
                        toggleSelection(index, item);
                    } else {
                        openViewer(index);
                    }
                });
                
                // Long-press for selection (mobile)
                item.addEventListener('touchstart', (e) => {
                    longPressTimer = setTimeout(() => {
                        enterSelectionMode();
                        toggleSelection(index, item);
                        if (navigator.vibrate) navigator.vibrate(50);
                    }, 500);
                });
                
                item.addEventListener('touchend', () => clearTimeout(longPressTimer));
                item.addEventListener('touchmove', () => clearTimeout(longPressTimer));
                
                item.dataset.index = index;
                grid.appendChild(item);
            });
            
            document.getElementById('photoCount').textContent = `${photos.length} photos`;
        }
        
        // Selection mode
        function enterSelectionMode() {
            selectionMode = true;
            document.getElementById('selectionToolbar').classList.add('active');
        }
        
        function exitSelectionMode() {
            selectionMode = false;
            selectedPhotos.clear();
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('selectionToolbar').classList.remove('active');
            updateSelectionCount();
        }
        
        function toggleSelection(index, element) {
            if (selectedPhotos.has(index)) {
                selectedPhotos.delete(index);
                element.classList.remove('selected');
            } else {
                selectedPhotos.add(index);
                element.classList.add('selected');
            }
            
            if (selectedPhotos.size === 0) {
                exitSelectionMode();
            } else {
                updateSelectionCount();
            }
        }
        
        function updateSelectionCount() {
            document.getElementById('downloadCount').textContent = 
                `Download (${selectedPhotos.size})`;
        }
        
        function selectAll() {
            document.querySelectorAll('.gallery-item').forEach((item, index) => {
                selectedPhotos.add(index);
                item.classList.add('selected');
            });
            updateSelectionCount();
        }
        
        function deselectAll() {
            exitSelectionMode();
        }
        
        // Viewer functions
        function openViewer(index) {
            currentIndex = index;
            const viewer = document.getElementById('viewer');
            const image = document.getElementById('viewerImage');
            
            image.src = photos[index];
            viewer.classList.add('active');
            resetZoom();
            updateViewerInfo();
            
            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }
        
        function closeViewer() {
            document.getElementById('viewer').classList.remove('active');
            document.body.style.overflow = '';
            resetZoom();
        }
        
        function updateViewerInfo() {
            document.getElementById('viewerInfo').textContent = 
                `${currentIndex + 1} / ${photos.length}`;
        }
        
        function nextImage() {
            if (currentIndex < photos.length - 1) {
                currentIndex++;
                document.getElementById('viewerImage').src = photos[currentIndex];
                updateViewerInfo();
                resetZoom();
            }
        }
        
        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                document.getElementById('viewerImage').src = photos[currentIndex];
                updateViewerInfo();
                resetZoom();
            }
        }
        
        // Zoom and pan
        function updateTransform() {
            const image = document.getElementById('viewerImage');
            image.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
            image.classList.toggle('zoomed', scale > 1);
        }
        
        function zoomIn() {
            scale = Math.min(scale + 0.5, 5);
            updateTransform();
        }
        
        function zoomOut() {
            scale = Math.max(scale - 0.5, 1);
            if (scale === 1) {
                translateX = 0;
                translateY = 0;
            }
            updateTransform();
        }
        
        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }
        
        // Touch and mouse dragging
        const image = document.getElementById('viewerImage');
        const container = document.getElementById('imageContainer');
        
        // Mouse events
        image.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                image.style.cursor = 'grabbing';
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateTransform();
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            if (scale > 1) image.style.cursor = 'move';
        });
        
        // Touch events
        let touchStartDist = 0;
        let touchStartScale = 1;
        
        image.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // Pinch zoom
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartScale = scale;
            } else if (e.touches.length === 1 && scale > 1) {
                // Drag
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        });
        
        image.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.max(1, Math.min(5, touchStartScale * (dist / touchStartDist)));
                updateTransform();
            } else if (isDragging && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });
        
        image.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // Swipe navigation
        let touchStartXPos = 0;
        
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && scale === 1) {
                touchStartXPos = e.touches[0].clientX;
            }
        });
        
        container.addEventListener('touchend', (e) => {
            if (scale === 1) {
                const touchEndX = e.changedTouches[0].clientX;
                const diff = touchStartXPos - touchEndX;
                
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        nextImage();
                    } else {
                        prevImage();
                    }
                }
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const viewer = document.getElementById('viewer');
            if (viewer.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeViewer();
                if (e.key === '+' || e.key === '=') zoomIn();
                if (e.key === '-') zoomOut();
                if (e.key === '0') resetZoom();
            }
        });
        
        // Download functions
        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                return true;
            } catch (error) {
                console.error('Download failed:', error);
                return false;
            }
        }
        
        function downloadCurrent() {
            const url = photos[currentIndex];
            const filename = `photo_${currentIndex + 1}.jpg`;
            downloadImage(url, filename);
        }
        
        async function downloadSelected() {
            if (selectedPhotos.size === 0) return;
            
            const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
            
            if (isMobile && selectedPhotos.size > 10) {
                if (!confirm(`Download ${selectedPhotos.size} photos?\n\nMobile browsers may limit bulk downloads.`)) {
                    return;
                }
            }
            
            for (const index of selectedPhotos) {
                const url = photos[index];
                const filename = `photo_${index + 1}.jpg`;
                await downloadImage(url, filename);
                await new Promise(resolve => setTimeout(resolve, isMobile ? 1000 : 500));
            }
            
            alert(`Downloaded ${selectedPhotos.size} photos!`);
            exitSelectionMode();
        }
        
        // Load photos on start
        loadPhotos();
    </script>
</body>
</html>
