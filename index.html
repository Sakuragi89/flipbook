<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Flipbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .flipbook-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        .flipbook-viewer {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .flipbook-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .flipbook-image.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-indicator {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .admin-link a:hover {
            color: #5568d3;
        }
        
        .thumbnail-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: thin;
        }
        
        .thumbnail {
            min-width: 100px;
            height: 70px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .thumbnail:hover {
            opacity: 0.8;
        }
        
        .thumbnail.active {
            opacity: 1;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 Screenshot Flipbook</h1>
        <p>Browse through uploaded screenshots</p>
    </div>
    
    <div class="flipbook-container">
        <div class="flipbook-viewer" id="viewer">
            <div class="loading">Loading screenshots...</div>
        </div>
        
        <div class="controls">
            <button class="btn" id="prevBtn" onclick="prevPage()" disabled>← Previous</button>
            <span class="page-indicator" id="pageIndicator">0 / 0</span>
            <button class="btn" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
        </div>
        
        <div class="thumbnail-strip" id="thumbnails"></div>
        
        <div class="admin-link">
            <a href="admin.html">🔐 Admin Panel - Upload Screenshots</a>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let screenshots = [];
        
        // GitHub configuration - UPDATE THESE VALUES
        const GITHUB_CONFIG = {
            owner: 'Sakuragi89',
            repo: 'flipbook',
            branch: 'main',
            path: 'screenshots'
        };
        
        async function loadScreenshots() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`
                );
                
                if (!response.ok) {
                    document.getElementById('viewer').innerHTML = 
                        '<div class="loading">No screenshots found yet. Upload some via the admin panel!</div>';
                    return;
                }
                
                const files = await response.json();
                screenshots = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|gif)$/i))
                    .map(file => file.download_url)
                    .sort();
                
                if (screenshots.length === 0) {
                    document.getElementById('viewer').innerHTML = 
                        '<div class="loading">No screenshots found yet. Upload some via the admin panel!</div>';
                    return;
                }
                
                displayScreenshots();
            } catch (error) {
                console.error('Error loading screenshots:', error);
                document.getElementById('viewer').innerHTML = 
                    '<div class="loading">Error loading screenshots. Check console for details.</div>';
            }
        }
        
        function displayScreenshots() {
            const viewer = document.getElementById('viewer');
            const thumbnails = document.getElementById('thumbnails');
            viewer.innerHTML = '';
            thumbnails.innerHTML = '';
            
            screenshots.forEach((url, index) => {
                // Main image
                const img = document.createElement('img');
                img.src = url;
                img.className = 'flipbook-image';
                if (index === 0) img.classList.add('active');
                viewer.appendChild(img);
                
                // Thumbnail
                const thumb = document.createElement('img');
                thumb.src = url;
                thumb.className = 'thumbnail';
                if (index === 0) thumb.classList.add('active');
                thumb.onclick = () => goToPage(index);
                thumbnails.appendChild(thumb);
            });
            
            updateControls();
        }
        
        function updateControls() {
            document.getElementById('pageIndicator').textContent = 
                `${currentPage + 1} / ${screenshots.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === screenshots.length - 1;
        }
        
        function goToPage(page) {
            const images = document.querySelectorAll('.flipbook-image');
            const thumbs = document.querySelectorAll('.thumbnail');
            
            images[currentPage].classList.remove('active');
            thumbs[currentPage].classList.remove('active');
            
            currentPage = page;
            
            images[currentPage].classList.add('active');
            thumbs[currentPage].classList.add('active');
            
            updateControls();
        }
        
        function nextPage() {
            if (currentPage < screenshots.length - 1) {
                goToPage(currentPage + 1);
            }
        }
        
        function prevPage() {
            if (currentPage > 0) {
                goToPage(currentPage - 1);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });
        
        // Load screenshots on page load
        loadScreenshots();
    </script>
</body>
</html>
