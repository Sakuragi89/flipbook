<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Flipbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .flipbook-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        .flipbook-viewer {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .flipbook-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .flipbook-image.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-indicator {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .admin-link a:hover {
            color: #5568d3;
        }
        
        .thumbnail-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: thin;
        }
        
        .thumbnail {
            min-width: 100px;
            height: 70px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .thumbnail:hover {
            opacity: 0.8;
        }
        
        .thumbnail.active {
            opacity: 1;
            border-color: #667eea;
        }
        
        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            cursor: zoom-out;
        }
        
        .gallery-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gallery-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            cursor: default;
        }
        
        .gallery-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: move;
        }
        
        .zoom-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        
        .zoom-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: white;
            transform: scale(1.1);
        }
        
        .zoom-level {
            color: white;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        
        .close-gallery {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .close-gallery:hover {
            background: white;
            transform: rotate(90deg);
        }
        
        .gallery-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .gallery-nav:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }
        
        .gallery-nav.prev {
            left: 20px;
        }
        
        .gallery-nav.next {
            right: 20px;
        }
        
        .click-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #999;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 Screenshot Flipbook</h1>
        <p>Browse through uploaded screenshots</p>
    </div>
    
    <div class="flipbook-container">
        <div class="flipbook-viewer" id="viewer">
            <div class="loading">Loading screenshots...</div>
            <div class="click-hint">Click on image to open in gallery view</div>
        </div>
        
        <div class="controls">
            <button class="btn" id="prevBtn" onclick="prevPage()" disabled>← Previous</button>
            <span class="page-indicator" id="pageIndicator">0 / 0</span>
            <button class="btn" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
        </div>
        
        <div class="thumbnail-strip" id="thumbnails"></div>
        
        <div class="admin-link">
            <a href="admin.html">🔐 Admin Panel - Upload Screenshots</a>
        </div>
    </div>
    
    <!-- Gallery Modal -->
    <div class="gallery-modal" id="galleryModal" onclick="closeGallery(event)">
        <button class="close-gallery" onclick="closeGallery(event)">×</button>
        <button class="gallery-nav prev" onclick="galleryPrev(event)">‹</button>
        <button class="gallery-nav next" onclick="galleryNext(event)">›</button>
        
        <div class="gallery-content" onclick="event.stopPropagation()">
            <img id="galleryImage" class="gallery-image" alt="Gallery view">
        </div>
        
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut(event)">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" onclick="zoomIn(event)">+</button>
            <button class="zoom-btn" onclick="resetZoom(event)" title="Reset">⟲</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let screenshots = [];
        let zoomLevel = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;
        
        // GitHub configuration - UPDATE THESE VALUES
        const GITHUB_CONFIG = {
            owner: 'sakuragi89',
            repo: 'flipbook',
            branch: 'main',
            path: 'screenshots'
        };
        
        async function loadScreenshots() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`
                );
                
                if (!response.ok) {
                    document.getElementById('viewer').innerHTML = 
                        '<div class="loading">No screenshots found yet. Upload some via the admin panel!</div>';
                    return;
                }
                
                const files = await response.json();
                screenshots = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|gif)$/i))
                    .map(file => file.download_url)
                    .sort();
                
                if (screenshots.length === 0) {
                    document.getElementById('viewer').innerHTML = 
                        '<div class="loading">No screenshots found yet. Upload some via the admin panel!</div>';
                    return;
                }
                
                displayScreenshots();
            } catch (error) {
                console.error('Error loading screenshots:', error);
                document.getElementById('viewer').innerHTML = 
                    '<div class="loading">Error loading screenshots. Check console for details.</div>';
            }
        }
        
        function displayScreenshots() {
            const viewer = document.getElementById('viewer');
            const thumbnails = document.getElementById('thumbnails');
            viewer.innerHTML = '<div class="click-hint">Click on image to open in gallery view</div>';
            thumbnails.innerHTML = '';
            
            screenshots.forEach((url, index) => {
                // Main image
                const img = document.createElement('img');
                img.src = url;
                img.className = 'flipbook-image';
                if (index === 0) img.classList.add('active');
                img.onclick = () => openGallery(index);
                img.style.cursor = 'pointer';
                viewer.appendChild(img);
                
                // Thumbnail
                const thumb = document.createElement('img');
                thumb.src = url;
                thumb.className = 'thumbnail';
                if (index === 0) thumb.classList.add('active');
                thumb.onclick = () => goToPage(index);
                thumbnails.appendChild(thumb);
            });
            
            updateControls();
        }
        
        function updateControls() {
            document.getElementById('pageIndicator').textContent = 
                `${currentPage + 1} / ${screenshots.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === screenshots.length - 1;
        }
        
        function goToPage(page) {
            const images = document.querySelectorAll('.flipbook-image');
            const thumbs = document.querySelectorAll('.thumbnail');
            
            images[currentPage].classList.remove('active');
            thumbs[currentPage].classList.remove('active');
            
            currentPage = page;
            
            images[currentPage].classList.add('active');
            thumbs[currentPage].classList.add('active');
            
            updateControls();
        }
        
        function nextPage() {
            if (currentPage < screenshots.length - 1) {
                goToPage(currentPage + 1);
            }
        }
        
        function prevPage() {
            if (currentPage > 0) {
                goToPage(currentPage - 1);
            }
        }
        
        // Gallery functions
        function openGallery(index) {
            currentPage = index;
            const modal = document.getElementById('galleryModal');
            const galleryImage = document.getElementById('galleryImage');
            
            galleryImage.src = screenshots[index];
            modal.classList.add('active');
            resetZoom();
            
            // Update main viewer
            goToPage(index);
        }
        
        function closeGallery(event) {
            event.stopPropagation();
            const modal = document.getElementById('galleryModal');
            modal.classList.remove('active');
            resetZoom();
        }
        
        function galleryNext(event) {
            event.stopPropagation();
            if (currentPage < screenshots.length - 1) {
                currentPage++;
                document.getElementById('galleryImage').src = screenshots[currentPage];
                goToPage(currentPage);
                resetZoom();
            }
        }
        
        function galleryPrev(event) {
            event.stopPropagation();
            if (currentPage > 0) {
                currentPage--;
                document.getElementById('galleryImage').src = screenshots[currentPage];
                goToPage(currentPage);
                resetZoom();
            }
        }
        
        // Zoom functions
        function zoomIn(event) {
            event.stopPropagation();
            zoomLevel = Math.min(zoomLevel + 0.25, 5);
            updateZoom();
        }
        
        function zoomOut(event) {
            event.stopPropagation();
            zoomLevel = Math.max(zoomLevel - 0.25, 0.5);
            updateZoom();
        }
        
        function resetZoom(event) {
            if (event) event.stopPropagation();
            zoomLevel = 1;
            translateX = 0;
            translateY = 0;
            updateZoom();
        }
        
        function updateZoom() {
            const img = document.getElementById('galleryImage');
            img.style.transform = `scale(${zoomLevel}) translate(${translateX}px, ${translateY}px)`;
            document.getElementById('zoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
            
            // Enable/disable dragging based on zoom
            img.style.cursor = zoomLevel > 1 ? 'move' : 'default';
        }
        
        // Image dragging for zoomed view
        const galleryImage = document.getElementById('galleryImage');
        
        galleryImage.addEventListener('mousedown', (e) => {
            if (zoomLevel > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                galleryImage.style.cursor = 'grabbing';
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateZoom();
            }
        });
        
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                if (zoomLevel > 1) {
                    galleryImage.style.cursor = 'move';
                }
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('galleryModal');
            const isGalleryOpen = modal.classList.contains('active');
            
            if (isGalleryOpen) {
                if (e.key === 'ArrowRight') galleryNext(e);
                if (e.key === 'ArrowLeft') galleryPrev(e);
                if (e.key === 'Escape') closeGallery(e);
                if (e.key === '+' || e.key === '=') zoomIn(e);
                if (e.key === '-') zoomOut(e);
                if (e.key === '0') resetZoom(e);
            } else {
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openGallery(currentPage);
                }
            }
        });
        
        // Mouse wheel zoom
        galleryImage.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn(e);
            } else {
                zoomOut(e);
            }
        });
        
        // Load screenshots on page load
        loadScreenshots();
    </script>
</body>
</html>
