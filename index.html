<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Flipbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .flipbook-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        .flipbook-viewer {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .flipbook-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .flipbook-image.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-indicator {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .admin-link a:hover {
            color: #5568d3;
        }
        
        .thumbnail-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: thin;
        }
        
        .thumbnail {
            min-width: 100px;
            height: 70px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .thumbnail:hover {
            opacity: 0.8;
        }
        
        .thumbnail.active {
            opacity: 1;
            border-color: #667eea;
        }
        
        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            cursor: zoom-out;
        }
        
        .gallery-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gallery-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            cursor: default;
        }
        
        .gallery-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: move;
        }
        
        .zoom-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        
        .zoom-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: white;
            transform: scale(1.1);
        }
        
        .zoom-level {
            color: white;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        
        .close-gallery {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .close-gallery:hover {
            background: white;
            transform: rotate(90deg);
        }
        
        .gallery-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .gallery-nav:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }
        
        .gallery-nav.prev {
            left: 20px;
        }
        
        .gallery-nav.next {
            right: 20px;
        }
        
        .download-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .download-btn:hover {
            background: rgba(102, 126, 234, 1);
            transform: scale(1.05);
        }
        
        .bulk-download-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .bulk-download-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .selection-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .selection-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .selection-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .selection-btn.secondary {
            background: #6c757d;
        }
        
        .selection-btn.secondary:hover {
            background: #5a6268;
        }
        
        .thumbnail.selected {
            border-color: #28a745;
            border-width: 4px;
            opacity: 1;
        }
        
        .thumbnail.selected::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            background: #28a745;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .thumbnail {
            position: relative;
        }
        
        .click-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #999;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 Screenshot Flipbook</h1>
        <p>Browse through uploaded screenshots</p>
    </div>
    
    <div class="flipbook-container">
        <div class="flipbook-viewer" id="viewer">
            <div class="loading">Loading screenshots...</div>
            <div class="click-hint">Click on image to open in gallery view</div>
        </div>
        
        <div class="controls">
            <button class="btn" id="prevBtn" onclick="prevPage()" disabled>← Previous</button>
            <span class="page-indicator" id="pageIndicator">0 / 0</span>
            <button class="btn" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
        </div>
        
        <div class="thumbnail-strip" id="thumbnails"></div>
        
        <div class="bulk-download-section">
            <h3>📥 Download Options</h3>
            <div class="selection-controls">
                <button class="selection-btn" onclick="selectAll()">✓ Select All</button>
                <button class="selection-btn secondary" onclick="deselectAll()">✗ Deselect All</button>
                <button class="selection-btn" onclick="downloadSelected()">⬇ Download Selected (<span id="selectedCount">0</span>)</button>
                <button class="selection-btn" onclick="downloadAll()">⬇ Download All Images</button>
            </div>
            <p style="color: #666; font-size: 13px; margin: 0;">
                💡 <strong>PC:</strong> Shift+Click or Ctrl+Click thumbnails | <strong>Mobile:</strong> Long-press (hold) thumbnails
            </p>
        </div>
        
        <div class="admin-link">
            <a href="admin.html">🔐 Admin Panel - Upload Screenshots</a>
        </div>
    </div>
    
    <!-- Gallery Modal -->
    <div class="gallery-modal" id="galleryModal" onclick="closeGallery(event)">
        <button class="download-btn" onclick="downloadCurrent(event)">
            <span>⬇</span>
            <span>Download</span>
        </button>
        <button class="close-gallery" onclick="closeGallery(event)">×</button>
        <button class="gallery-nav prev" onclick="galleryPrev(event)">‹</button>
        <button class="gallery-nav next" onclick="galleryNext(event)">›</button>
        
        <div class="gallery-content" onclick="event.stopPropagation()">
            <img id="galleryImage" class="gallery-image" alt="Gallery view">
        </div>
        
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut(event)">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" onclick="zoomIn(event)">+</button>
            <button class="zoom-btn" onclick="resetZoom(event)" title="Reset">⟲</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let screenshots = [];
        let zoomLevel = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;
        let selectedImages = new Set();
        
        // Configuration - UPDATE THESE VALUES
        const GITHUB_CONFIG = {
            owner: 'YOUR_GITHUB_USERNAME',
            repo: 'YOUR_REPO_NAME',
            branch: 'main',
            path: 'screenshots'
        };
        
        // Google Drive Configuration (Optional - leave empty to use GitHub only)
        const GDRIVE_CONFIG = {
            enabled: false,  // Set to true to use Google Drive
            folderLinks: []  // Add shareable folder links here
        };
        
        async function loadScreenshots() {
            screenshots = [];
            
            // Load from Google Drive if enabled
            if (GDRIVE_CONFIG.enabled && GDRIVE_CONFIG.folderLinks.length > 0) {
                await loadFromGoogleDrive();
            }
            
            // Load from GitHub
            await loadFromGitHub();
            
            if (screenshots.length === 0) {
                document.getElementById('viewer').innerHTML = 
                    '<div class="loading">No screenshots found yet. Upload some via the admin panel or add Google Drive links!</div>';
                return;
            }
            
            displayScreenshots();
        }
        
        async function loadFromGoogleDrive() {
            for (const link of GDRIVE_CONFIG.folderLinks) {
                try {
                    // Extract folder ID from various Google Drive URL formats
                    let folderId = null;
                    
                    if (link.includes('folders/')) {
                        folderId = link.split('folders/')[1].split('?')[0];
                    } else if (link.includes('id=')) {
                        folderId = link.split('id=')[1].split('&')[0];
                    }
                    
                    if (!folderId) continue;
                    
                    // Use Google Drive API to list files
                    const apiUrl = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+(mimeType+contains+'image/')&fields=files(id,name,mimeType)&key=AIzaSyDummyKeyForDemo`;
                    
                    // Note: For production, you'd need a proper API key or use direct image links
                    // For now, we'll support direct image file links
                    
                    // If it's a direct file link, convert it
                    if (link.includes('/file/d/')) {
                        const fileId = link.split('/file/d/')[1].split('/')[0];
                        const directUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
                        screenshots.push(directUrl);
                    }
                    
                } catch (error) {
                    console.warn('Error loading from Google Drive:', error);
                }
            }
        }
        
        async function loadFromGitHub() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`
                );
                
                if (!response.ok) {
                    return;
                }
                
                const files = await response.json();
                const githubImages = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|gif)$/i))
                    .map(file => file.download_url)
                    .sort();
                
                screenshots.push(...githubImages);
                
            } catch (error) {
                console.error('Error loading from GitHub:', error);
            }
        }
        
        function displayScreenshots() {
            const viewer = document.getElementById('viewer');
            const thumbnails = document.getElementById('thumbnails');
            viewer.innerHTML = '<div class="click-hint">Click on image to open in gallery view</div>';
            thumbnails.innerHTML = '';
            
            screenshots.forEach((url, index) => {
                // Main image
                const img = document.createElement('img');
                img.src = url;
                img.className = 'flipbook-image';
                if (index === 0) img.classList.add('active');
                img.onclick = () => openGallery(index);
                img.style.cursor = 'pointer';
                viewer.appendChild(img);
                
                // Thumbnail
                const thumb = document.createElement('img');
                thumb.src = url;
                thumb.className = 'thumbnail';
                if (index === 0) thumb.classList.add('active');
                
                // PC: Shift/Ctrl + Click for selection
                thumb.onclick = (e) => {
                    if (e.shiftKey || e.ctrlKey) {
                        toggleSelection(index);
                        e.stopPropagation();
                    } else {
                        goToPage(index);
                    }
                };
                
                // Mobile: Long-press for selection
                let longPressTimer;
                thumb.addEventListener('touchstart', (e) => {
                    longPressTimer = setTimeout(() => {
                        toggleSelection(index);
                        // Haptic feedback if available
                        if (navigator.vibrate) {
                            navigator.vibrate(50);
                        }
                    }, 500); // 500ms long press
                });
                
                thumb.addEventListener('touchend', () => {
                    clearTimeout(longPressTimer);
                });
                
                thumb.addEventListener('touchmove', () => {
                    clearTimeout(longPressTimer);
                });
                
                thumb.dataset.index = index;
                thumbnails.appendChild(thumb);
            });
            
            updateControls();
            updateSelectionCount();
        }
        
        function toggleSelection(index) {
            const thumb = document.querySelector(`.thumbnail[data-index="${index}"]`);
            
            if (selectedImages.has(index)) {
                selectedImages.delete(index);
                thumb.classList.remove('selected');
            } else {
                selectedImages.add(index);
                thumb.classList.add('selected');
            }
            
            updateSelectionCount();
        }
        
        function selectAll() {
            selectedImages.clear();
            screenshots.forEach((_, index) => {
                selectedImages.add(index);
            });
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.classList.add('selected');
            });
            updateSelectionCount();
        }
        
        function deselectAll() {
            selectedImages.clear();
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.classList.remove('selected');
            });
            updateSelectionCount();
        }
        
        function updateSelectionCount() {
            document.getElementById('selectedCount').textContent = selectedImages.size;
        }
        
        // Download functions
        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // Clean up after a delay
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                
                return true;
            } catch (error) {
                console.error('Download failed:', error);
                return false;
            }
        }
        
        function downloadCurrent(event) {
            event.stopPropagation();
            const url = screenshots[currentPage];
            const filename = `screenshot_${currentPage + 1}.jpg`;
            downloadImage(url, filename);
        }
        
        async function downloadSelected() {
            if (selectedImages.size === 0) {
                showDownloadAlert('Please select images first!\n\nPC: Shift+Click or Ctrl+Click\nMobile: Long-press (hold) on thumbnails');
                return;
            }
            
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const count = selectedImages.size;
            
            // Mobile warning for bulk downloads
            if (isMobile && count > 10) {
                if (!confirm(`You selected ${count} images.\n\nMobile browsers may limit bulk downloads. Download anyway?\n\nTip: For many images, use a PC or download one-by-one from gallery.`)) {
                    return;
                }
            }
            
            const button = event.target.closest('button');
            const originalText = button.innerHTML;
            button.innerHTML = '⏳ Downloading...';
            button.disabled = true;
            
            let successCount = 0;
            let failCount = 0;
            
            for (const index of selectedImages) {
                const url = screenshots[index];
                const filename = `screenshot_${index + 1}.jpg`;
                
                // Update progress
                button.innerHTML = `⏳ Downloading ${successCount + 1}/${count}...`;
                
                const success = await downloadImage(url, filename);
                if (success) {
                    successCount++;
                } else {
                    failCount++;
                }
                
                // Delay between downloads (longer on mobile)
                const delay = isMobile ? 1000 : 500;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            
            button.innerHTML = originalText;
            button.disabled = false;
            
            if (failCount > 0) {
                showDownloadAlert(`Downloaded ${successCount} images.\n${failCount} failed.\n\nTip: Try downloading fewer images at once.`);
            } else {
                showDownloadAlert(`✓ Successfully downloaded ${successCount} images!`);
            }
        }
        
        async function downloadAll() {
            const count = screenshots.length;
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            
            let confirmMessage = `Download all ${count} images?`;
            
            if (isMobile) {
                confirmMessage += `\n\n⚠️ Mobile Warning:\nYour browser may limit bulk downloads.\n\nFor best results on mobile:\n• Download from gallery one-by-one\n• Or use a PC for bulk downloads\n\nContinue anyway?`;
            } else {
                confirmMessage += `\n\nThis may take a while.`;
            }
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            const button = event.target.closest('button');
            const originalText = button.innerHTML;
            button.innerHTML = '⏳ Downloading...';
            button.disabled = true;
            
            let successCount = 0;
            let failCount = 0;
            
            for (let i = 0; i < count; i++) {
                const url = screenshots[i];
                const filename = `screenshot_${i + 1}.jpg`;
                
                // Update progress
                button.innerHTML = `⏳ Downloading ${i + 1}/${count}...`;
                
                const success = await downloadImage(url, filename);
                if (success) {
                    successCount++;
                } else {
                    failCount++;
                }
                
                // Delay between downloads (longer on mobile)
                const delay = isMobile ? 1000 : 500;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            
            button.innerHTML = originalText;
            button.disabled = false;
            
            if (failCount > 0) {
                showDownloadAlert(`Downloaded ${successCount} of ${count} images.\n${failCount} failed.\n\nTip: Try using a PC for large bulk downloads.`);
            } else {
                showDownloadAlert(`✓ Successfully downloaded all ${count} images!`);
            }
        }
        
        function showDownloadAlert(message) {
            alert(message);
        }
        
        function updateControls() {
            document.getElementById('pageIndicator').textContent = 
                `${currentPage + 1} / ${screenshots.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === screenshots.length - 1;
        }
        
        function goToPage(page) {
            const images = document.querySelectorAll('.flipbook-image');
            const thumbs = document.querySelectorAll('.thumbnail');
            
            images[currentPage].classList.remove('active');
            thumbs[currentPage].classList.remove('active');
            
            currentPage = page;
            
            images[currentPage].classList.add('active');
            thumbs[currentPage].classList.add('active');
            
            updateControls();
        }
        
        function nextPage() {
            if (currentPage < screenshots.length - 1) {
                goToPage(currentPage + 1);
            }
        }
        
        function prevPage() {
            if (currentPage > 0) {
                goToPage(currentPage - 1);
            }
        }
        
        // Gallery functions
        function openGallery(index) {
            currentPage = index;
            const modal = document.getElementById('galleryModal');
            const galleryImage = document.getElementById('galleryImage');
            
            galleryImage.src = screenshots[index];
            modal.classList.add('active');
            resetZoom();
            
            // Update main viewer
            goToPage(index);
        }
        
        function closeGallery(event) {
            event.stopPropagation();
            const modal = document.getElementById('galleryModal');
            modal.classList.remove('active');
            resetZoom();
        }
        
        function galleryNext(event) {
            event.stopPropagation();
            if (currentPage < screenshots.length - 1) {
                currentPage++;
                document.getElementById('galleryImage').src = screenshots[currentPage];
                goToPage(currentPage);
                resetZoom();
            }
        }
        
        function galleryPrev(event) {
            event.stopPropagation();
            if (currentPage > 0) {
                currentPage--;
                document.getElementById('galleryImage').src = screenshots[currentPage];
                goToPage(currentPage);
                resetZoom();
            }
        }
        
        // Zoom functions
        function zoomIn(event) {
            event.stopPropagation();
            zoomLevel = Math.min(zoomLevel + 0.25, 5);
            updateZoom();
        }
        
        function zoomOut(event) {
            event.stopPropagation();
            zoomLevel = Math.max(zoomLevel - 0.25, 0.5);
            updateZoom();
        }
        
        function resetZoom(event) {
            if (event) event.stopPropagation();
            zoomLevel = 1;
            translateX = 0;
            translateY = 0;
            updateZoom();
        }
        
        function updateZoom() {
            const img = document.getElementById('galleryImage');
            img.style.transform = `scale(${zoomLevel}) translate(${translateX}px, ${translateY}px)`;
            document.getElementById('zoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
            
            // Enable/disable dragging based on zoom
            img.style.cursor = zoomLevel > 1 ? 'move' : 'default';
        }
        
        // Image dragging for zoomed view
        const galleryImage = document.getElementById('galleryImage');
        
        // Mouse drag (PC)
        galleryImage.addEventListener('mousedown', (e) => {
            if (zoomLevel > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                galleryImage.style.cursor = 'grabbing';
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateZoom();
            }
        });
        
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                if (zoomLevel > 1) {
                    galleryImage.style.cursor = 'move';
                }
            }
        });
        
        // Touch drag (Mobile)
        let touchStartX, touchStartY;
        
        galleryImage.addEventListener('touchstart', (e) => {
            if (zoomLevel > 1 && e.touches.length === 1) {
                isDragging = true;
                touchStartX = e.touches[0].clientX - translateX;
                touchStartY = e.touches[0].clientY - translateY;
            }
        });
        
        galleryImage.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                e.preventDefault();
                translateX = e.touches[0].clientX - touchStartX;
                translateY = e.touches[0].clientY - touchStartY;
                updateZoom();
            }
        });
        
        galleryImage.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // Pinch zoom (Mobile)
        let initialDistance = 0;
        let initialZoom = 1;
        
        galleryImage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = zoomLevel;
            }
        });
        
        galleryImage.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                const scale = currentDistance / initialDistance;
                zoomLevel = Math.max(0.5, Math.min(5, initialZoom * scale));
                updateZoom();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('galleryModal');
            const isGalleryOpen = modal.classList.contains('active');
            
            if (isGalleryOpen) {
                if (e.key === 'ArrowRight') galleryNext(e);
                if (e.key === 'ArrowLeft') galleryPrev(e);
                if (e.key === 'Escape') closeGallery(e);
                if (e.key === '+' || e.key === '=') zoomIn(e);
                if (e.key === '-') zoomOut(e);
                if (e.key === '0') resetZoom(e);
            } else {
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openGallery(currentPage);
                }
            }
        });
        
        // Mouse wheel zoom
        galleryImage.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn(e);
            } else {
                zoomOut(e);
            }
        });
        
        // Load screenshots on page load
        loadScreenshots();
    </script>
</body>
</html>
